<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Terminal Cursor Z Logo</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111; }
    svg { width: 320px; height: 320px; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <svg viewBox="40 30 280 280" role="img" aria-label="Terminal cursor Z logo">
    <rect x="40" y="30" width="280" height="280" rx="44" fill="#07090A"/>

    <path d="M116 101 H236 L116 221 H201"
          fill="none" stroke="#F2F5F3" stroke-width="28"
          stroke-linecap="butt" stroke-linejoin="round"/>

    <rect class="cursor" x="210" y="189" width="34" height="64" fill="#2BFF3A"/>
  </svg>
</body>
</html>
